org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Coordenadas del artefacto -----------------------------------------------
GROUP=org.borealnetwork
# Sigue la misma numeración que facecheck-kmp: 0.1.0 aquí es el mismo código
# que 0.1.0 allá. Si las versiones se separan, MIRROR.lock deja de cuadrar.
VERSION_NAME=0.1.0

# Upstream del que se sincroniza mirror/. Lo usa tools/sync-from-kmp.sh y el
# job "mirror" de CI.
FACECHECK_KMP_REPO=https://github.com/baudelioandalon/facecheck-kmp.git

# --- Publicación en Maven Central --------------------------------------------
# Todo lo de abajo son PLACEHOLDERS y el build funciona sin ellos: si falta
# alguno, las tareas de publicación siguen existiendo pero apuntan a
# ~/.m2/repository y no se firma nada. Ver "Publicar" en el README.
#
# No pongas credenciales reales aquí: este archivo se commitea. Van en
# ~/.gradle/gradle.properties (fuera del repo) o en variables de entorno
# ORG_GRADLE_PROJECT_<nombre>.

# Usuario y contraseña del Central Portal (https://central.sonatype.com).
# mavenCentralUsername=
# mavenCentralPassword=

# Llave GPG en formato ASCII armored, en una sola línea con \n literales.
# Exportar con: gpg --armor --export-secret-keys <KEYID> | awk 'NR>1{printf "\\n"} {printf "%s", $0}'
# signingInMemoryKey=
# signingInMemoryKeyPassword=
